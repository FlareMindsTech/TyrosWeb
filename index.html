<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F1B18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tyros">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.flaremindstech.com;">

  <title>Tyros Admin</title>

  <!-- Google Fonts: Barlow Condensed & Inter (swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Modular Stylesheets (No build step) -->
  <link rel="stylesheet" href="css/tokens.css?v=2.2.1">
  <link rel="stylesheet" href="css/base.css?v=2.2.1">
  <link rel="stylesheet" href="css/components.css?v=2.2.1">
  <link rel="stylesheet" href="css/layout.css?v=2.2.1">
  <link rel="stylesheet" href="css/pages.css?v=2.2.1">
</head>
<body>
  <div id="app-root">
    <!-- Desktop Left Sidebar (>= 1100px) -->
    <aside class="desktop-sidebar" aria-label="Desktop Navigation">
      <div class="sidebar-brand">
        <div class="sidebar-logo-icon">T</div>
        <div>
          <div class="sidebar-title">Tyros Admin</div>
          <div class="sidebar-subtitle">Workshop Operations</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#/dashboard" class="sidebar-link" data-route="#/dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#/entries" class="sidebar-link" data-route="#/entries">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Entries</span>
        </a>
        <a href="#/report" class="sidebar-link" data-route="#/report">
          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Report</span>
        </a>
        <a href="#/manage" class="sidebar-link" data-route="#/manage">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Manage</span>
        </a>
        <a href="#/profile" class="sidebar-link" data-route="#/profile">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="sidebar-theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="sidebar-logout-btn" class="theme-toggle-btn" aria-label="Sign out" title="Sign out" style="color:var(--status-overdue);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-content-wrapper">
      <!-- Desktop Top Bar (>= 1100px) -->
      <header class="desktop-top-bar" aria-label="Desktop Top Bar">
        <div class="desktop-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="desktop-global-search" placeholder="Search enquiries, vehicle, mobile..." aria-label="Search" />
        </div>
        <div style="display:flex; align-items:center; gap:var(--space-3);">
          <span id="desktop-user-badge" style="font-size:13.5px; font-weight:600; color:var(--text-secondary);">Bharath</span>
          <div style="width:36px; height:36px; border-radius:var(--radius-pill); background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;">B</div>
        </div>
      </header>

      <!-- Scrollable Main Content -->
      <main id="main-scroll-area" tabindex="-1">
        <!-- Route views injected here dynamically -->
      </main>

      <!-- Mobile Bottom Tab Bar (< 1100px) -->
      <nav class="mobile-tab-bar" aria-label="Mobile Navigation">
        <a href="#/dashboard" class="tab-btn" data-route="#/dashboard">
          <div class="tab-icon-wrapper">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </div>
          <span class="tab-label">Dashboard</span>
        </a>
        <a href="#/entries" class="tab-btn" data-route="#/entries">
          <div class="tab-icon-wrapper">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <span class="tab-label">Entries</span>
        </a>
        <a href="#/report" class="tab-btn" data-route="#/report">
          <div class="tab-icon-wrapper">
            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
          <span class="tab-label">Report</span>
        </a>
        <a href="#/manage" class="tab-btn" data-route="#/manage">
          <div class="tab-icon-wrapper">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <span class="tab-label">Manage</span>
        </a>
        <a href="#/profile" class="tab-btn" data-route="#/profile">
          <div class="tab-icon-wrapper">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <span class="tab-label">Profile</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Master App Entry Module -->
  <script type="module" src="app.js?v=2.2.1"></script>
</body>
</html>
